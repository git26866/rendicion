<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rendición">
<meta name="theme-color" content="#0B6B5B">
<title>Rendición de Gastos</title>
<style>
  :root{
    --paper:#F7F6F2; --surface:#FFFFFF; --surface-2:#FBFAF6;
    --ink:#1A1D1A; --muted:#6B7069; --faint:#9A9E97;
    --line:#E4E2DA; --line-strong:#D6D3C8;
    --accent:#0B6B5B; --accent-2:#0E8C74; --accent-soft:#E4F0EC;
    --amber:#C2751A; --danger:#B23B2E;
    --shadow:0 1px 2px rgba(26,29,26,.06),0 8px 24px rgba(26,29,26,.08);
    --radius:16px; --radius-sm:11px;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#14161A; --surface:#1C1F24; --surface-2:#20242A;
      --ink:#ECEEEA; --muted:#9AA0A0; --faint:#6B7278;
      --line:#2A2E33; --line-strong:#363B41;
      --accent:#2FB79A; --accent-2:#38C9AA; --accent-soft:#173029;
      --amber:#D98A34; --danger:#E0685A;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"]{
    --paper:#F7F6F2; --surface:#FFFFFF; --surface-2:#FBFAF6;
    --ink:#1A1D1A; --muted:#6B7069; --faint:#9A9E97;
    --line:#E4E2DA; --line-strong:#D6D3C8;
    --accent:#0B6B5B; --accent-2:#0E8C74; --accent-soft:#E4F0EC;
    --amber:#C2751A; --danger:#B23B2E;
    --shadow:0 1px 2px rgba(26,29,26,.06),0 8px 24px rgba(26,29,26,.08);
  }
  :root[data-theme="dark"]{
    --paper:#14161A; --surface:#1C1F24; --surface-2:#20242A;
    --ink:#ECEEEA; --muted:#9AA0A0; --faint:#6B7278;
    --line:#2A2E33; --line-strong:#363B41;
    --accent:#2FB79A; --accent-2:#38C9AA; --accent-soft:#173029;
    --amber:#D98A34; --danger:#E0685A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
    font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums;
  }
  #app{max-width:560px;margin:0 auto;padding:0 16px 132px;min-height:100vh;}
  h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em;text-wrap:balance;}
  button{font-family:inherit;cursor:pointer;}
  .tnum{font-variant-numeric:tabular-nums;}

  /* Topbar */
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
    gap:12px;padding:14px 2px 12px;background:linear-gradient(var(--paper) 72%,rgba(247,246,242,0));backdrop-filter:saturate(1.1);}
  @media (prefers-color-scheme:dark){.topbar{background:linear-gradient(var(--paper) 72%,rgba(20,22,26,0));}}
  :root[data-theme="dark"] .topbar{background:linear-gradient(var(--paper) 72%,rgba(20,22,26,0));}
  :root[data-theme="light"] .topbar{background:linear-gradient(var(--paper) 72%,rgba(247,246,242,0));}
  .brand{display:flex;align-items:center;gap:11px;}
  .mark{width:38px;height:38px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:0 0 auto;box-shadow:var(--shadow);}
  .mark svg{width:21px;height:21px;display:block;}
  .brand h1{font-size:18px;line-height:1.05;}
  .brand p{margin:1px 0 0;font-size:12.5px;color:var(--muted);}
  .icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
    display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .08s;}
  .icon-btn:active{transform:scale(.94);}
  .icon-btn svg{width:20px;height:20px;}

  /* Summary */
  .summary{position:relative;overflow:hidden;background:
      radial-gradient(120% 140% at 100% 0%,var(--accent-soft),transparent 60%),var(--surface);
    border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 16px;box-shadow:var(--shadow);margin-bottom:16px;}
  .summary .label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;}
  .summary .amount{display:block;font-size:38px;font-weight:700;letter-spacing:-.02em;margin-top:2px;color:var(--ink);}
  .summary-meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);
    font-size:13px;color:var(--muted);}
  .summary-meta b{color:var(--ink);font-weight:600;}
  .chip-accent{color:var(--accent);font-weight:600;}

  /* Section label */
  .sec-label{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 10px;
    font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;}

  /* List */
  .list{display:flex;flex-direction:column;gap:10px;}
  .receipt{display:flex;gap:13px;align-items:center;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius-sm);padding:10px;box-shadow:var(--shadow);transition:transform .08s;}
  .receipt:active{transform:scale(.992);}
  .thumb{width:56px;height:56px;border-radius:9px;object-fit:cover;flex:0 0 auto;background:var(--surface-2);border:1px solid var(--line);}
  .r-main{flex:1;min-width:0;}
  .r-desc{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .r-sub{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;gap:8px;align-items:center;}
  .r-cat{background:var(--accent-soft);color:var(--accent);padding:1px 7px;border-radius:20px;font-size:11px;font-weight:600;}
  .r-amt{font-weight:700;font-size:16px;white-space:nowrap;padding-left:6px;}
  .r-chevron{color:var(--faint);flex:0 0 auto;}
  .r-chevron svg{width:18px;height:18px;display:block;}

  /* Empty state */
  .empty{text-align:center;padding:46px 24px;color:var(--muted);border:1.5px dashed var(--line-strong);border-radius:var(--radius);background:var(--surface-2);}
  .empty .em-ic{width:52px;height:52px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 14px;}
  .empty .em-ic svg{width:26px;height:26px;}
  .empty h3{font-size:16px;color:var(--ink);margin-bottom:5px;}
  .empty p{margin:0;font-size:13.5px;line-height:1.5;}

  /* Action bar */
  .actionbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:10px;
    max-width:560px;margin:0 auto;padding:12px 16px calc(12px + var(--safe-b));
    background:linear-gradient(rgba(247,246,242,0),var(--paper) 34%);}
  @media (prefers-color-scheme:dark){.actionbar{background:linear-gradient(rgba(20,22,26,0),var(--paper) 34%);}}
  :root[data-theme="dark"] .actionbar{background:linear-gradient(rgba(20,22,26,0),var(--paper) 34%);}
  :root[data-theme="light"] .actionbar{background:linear-gradient(rgba(247,246,242,0),var(--paper) 34%);}
  .btn{border:none;border-radius:13px;padding:15px 16px;font-size:15.5px;font-weight:650;letter-spacing:-.01em;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,opacity .15s;box-shadow:var(--shadow);}
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.45;pointer-events:none;box-shadow:none;}
  .btn svg{width:19px;height:19px;}
  .btn-primary{flex:1;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);}
  .btn-accent{flex:1;background:var(--accent);color:#fff;}
  .btn-block{width:100%;}
  .btn-ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);box-shadow:none;}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid var(--line);box-shadow:none;}

  /* Sheets */
  .scrim{position:fixed;inset:0;z-index:40;background:rgba(20,22,26,.42);opacity:0;pointer-events:none;transition:opacity .22s;}
  .scrim.show{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:560px;margin:0 auto;
    background:var(--surface);border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:none;
    box-shadow:0 -12px 40px rgba(0,0,0,.22);transform:translateY(103%);transition:transform .28s cubic-bezier(.32,.72,0,1);
    max-height:92vh;display:flex;flex-direction:column;}
  .sheet.show{transform:translateY(0);}
  .sheet-grip{width:38px;height:5px;border-radius:3px;background:var(--line-strong);margin:9px auto 2px;flex:0 0 auto;}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:6px 20px 12px;border-bottom:1px solid var(--line);}
  .sheet-head h2{font-size:17px;}
  .sheet-body{padding:16px 20px calc(20px + var(--safe-b));overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .link-btn{background:none;border:none;color:var(--accent);font-size:15px;font-weight:600;padding:4px;}
  .link-btn.mut{color:var(--muted);}

  /* Form fields */
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.01em;}
  .field input,.field select,.field textarea{width:100%;font-family:inherit;font-size:16px;color:var(--ink);
    background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:12px 13px;outline:none;transition:border-color .15s,box-shadow .15s;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .field textarea{resize:vertical;min-height:62px;}
  .amt-wrap{position:relative;}
  .amt-wrap .cur{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600;pointer-events:none;}
  .amt-wrap input{padding-left:28px;font-size:20px;font-weight:700;}
  .row2{display:flex;gap:12px;}
  .row2>*{flex:1;}
  .photo-preview{width:100%;height:190px;border-radius:13px;object-fit:cover;background:var(--surface-2);border:1px solid var(--line);margin-bottom:14px;display:block;}
  .retake{display:flex;align-items:center;justify-content:center;gap:7px;font-size:13.5px;color:var(--accent);font-weight:600;margin:-6px 0 14px;}
  .form-actions{display:flex;flex-direction:column;gap:10px;margin-top:6px;}

  /* Result sheet options */
  .opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);
    border-radius:13px;padding:14px;margin-bottom:10px;color:var(--ink);transition:transform .08s;}
  .opt:active{transform:scale(.99);}
  .opt-ic{width:40px;height:40px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:0 0 auto;}
  .opt-ic svg{width:21px;height:21px;}
  .opt-tx{flex:1;min-width:0;}
  .opt-tx b{display:block;font-size:15px;font-weight:650;}
  .opt-tx span{display:block;font-size:12.5px;color:var(--muted);margin-top:1px;line-height:1.4;}
  .result-total{text-align:center;padding:8px 0 16px;}
  .result-total .amount{font-size:32px;font-weight:700;color:var(--accent);letter-spacing:-.02em;}
  .result-total .sub{font-size:13px;color:var(--muted);margin-top:2px;}
  .hint{font-size:12.5px;color:var(--muted);line-height:1.5;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-top:4px;}

  /* OCR */
  .photo-wrap{position:relative;margin-bottom:10px;}
  .photo-wrap .photo-preview{margin-bottom:0;}
  .ocr-overlay{position:absolute;inset:0;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    background:rgba(20,22,26,.52);color:#fff;font-size:13.5px;font-weight:600;backdrop-filter:blur(2px);}
  .ocr-spin{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .edit-tools{display:flex;gap:8px;margin-bottom:12px;}
  .tool-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:600;color:var(--accent);
    background:var(--accent-soft);border:1px solid transparent;border-radius:10px;padding:9px;transition:transform .08s;}
  .tool-btn:active{transform:scale(.97);}
  .tool-btn:disabled{opacity:.5;pointer-events:none;}
  .tool-btn svg{width:15px;height:15px;}
  .ocr-note{font-size:12.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:10px 13px;margin-bottom:14px;line-height:1.45;}
  .ocr-note.warn{color:var(--amber);background:rgba(194,117,26,.13);}
  :root[data-theme="dark"] .ocr-note.warn{background:rgba(217,138,52,.16);}
  @media (prefers-color-scheme:dark){.ocr-note.warn{background:rgba(217,138,52,.16);}}
  .field input.suggested,.field select.suggested{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px rgba(11,107,91,.12);}

  /* Toast */
  .toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));translate:-50% 0;transform:translateY(16px);
    background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:30px;font-size:14px;font-weight:600;
    z-index:80;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 8px 24px rgba(0,0,0,.28);white-space:nowrap;}
  .toast.show{opacity:1;transform:translateY(0);}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 3v18l2-1.3L9 21l2-1.3L13 21l2-1.3L17 21l2-1.3V3l-2 1.3L15 3l-2 1.3L11 3 9 4.3 7 3z"/>
          <path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"/>
        </svg>
      </div>
      <div><h1>Rendición</h1><p>Boletas y gastos</p></div>
    </div>
    <button id="btnSettings" class="icon-btn" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>

  <section class="summary">
    <span class="label">Total acumulado</span>
    <span class="amount tnum" id="sumTotal">$0</span>
    <div class="summary-meta">
      <span><b id="sumCount">0</b> boletas</span>
      <span id="sumPeriod"></span>
      <span id="sumWho" class="chip-accent"></span>
    </div>
  </section>

  <div class="sec-label"><span>Boletas del período</span><span id="secClear"></span></div>
  <section id="list" class="list" aria-live="polite"></section>
</div>

<nav class="actionbar">
  <button id="btnAdd" class="btn btn-primary">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    Agregar boleta
  </button>
  <button id="btnGenerate" class="btn btn-accent">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 15l2 2 4-4"/></svg>
    Generar
  </button>
</nav>

<input id="fileInput" type="file" accept="image/*" hidden>

<!-- Scrim -->
<div id="scrim" class="scrim"></div>

<!-- Editor sheet -->
<div id="editorSheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
  <div class="sheet-grip"></div>
  <div class="sheet-head">
    <button class="link-btn mut" data-close>Cancelar</button>
    <h2 id="editorTitle">Nueva boleta</h2>
    <button class="link-btn" id="btnSaveReceipt">Guardar</button>
  </div>
  <div class="sheet-body">
    <div class="photo-wrap">
      <img id="editPhoto" class="photo-preview" alt="Foto de la boleta">
      <div id="ocrOverlay" class="ocr-overlay" hidden><span class="ocr-spin"></span><span>Leyendo boleta…</span></div>
    </div>
    <div class="edit-tools">
      <button type="button" class="tool-btn" id="btnRetake">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/></svg>
        Cambiar foto
      </button>
      <button type="button" class="tool-btn" id="btnRescan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3v6h-6M3 21v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L21 9M21 15a9 9 0 0 1-14.9 3.4L3 15"/></svg>
        Leer de nuevo
      </button>
    </div>
    <div id="ocrNote" class="ocr-note" hidden></div>
    <div class="field">
      <label for="fDesc">Descripción del gasto</label>
      <input id="fDesc" type="text" placeholder="Ej: Almuerzo con cliente" autocomplete="off">
    </div>
    <div class="field amt-wrap">
      <label for="fAmt">Monto</label>
      <span class="cur" style="top:auto;bottom:12px;transform:none;">$</span>
      <input id="fAmt" type="text" inputmode="numeric" placeholder="0">
    </div>
    <div class="row2">
      <div class="field">
        <label for="fDate">Fecha</label>
        <input id="fDate" type="date">
      </div>
      <div class="field">
        <label for="fCat">Categoría</label>
        <select id="fCat">
          <option>General</option><option>Alimentación</option><option>Transporte</option>
          <option>Alojamiento</option><option>Insumos</option><option>Combustible</option>
          <option>Peaje/Estac.</option><option>Otros</option>
        </select>
      </div>
    </div>
    <div class="form-actions">
      <button id="btnDeleteReceipt" class="btn btn-danger btn-block" hidden>Eliminar boleta</button>
    </div>
  </div>
</div>

<!-- Settings sheet -->
<div id="settingsSheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="sheet-grip"></div>
  <div class="sheet-head">
    <button class="link-btn mut" data-close>Cerrar</button>
    <h2 id="setTitle">Ajustes</h2>
    <button class="link-btn" id="btnSaveSettings">Guardar</button>
  </div>
  <div class="sheet-body">
    <div class="field">
      <label for="sName">Nombre del solicitante</label>
      <input id="sName" type="text" placeholder="Tu nombre" autocomplete="name">
    </div>
    <div class="field">
      <label for="sTo">Correo destinatario</label>
      <input id="sTo" type="email" inputmode="email" placeholder="finanzas@empresa.cl" autocapitalize="none" autocomplete="email">
    </div>
    <div class="field">
      <label for="sCc">Correo en copia (opcional)</label>
      <input id="sCc" type="email" inputmode="email" placeholder="jefatura@empresa.cl" autocapitalize="none">
    </div>
    <div class="field">
      <label for="sCompany">Empresa / centro de costo</label>
      <input id="sCompany" type="text" placeholder="Ej: Südlich Capital S.A.">
    </div>
    <div class="field">
      <label for="sNote">Motivo o glosa (opcional)</label>

    </div>

</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script>
(function(){
  "use strict";
  var CLP = new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0});
  var money = function(n){ return CLP.format(Math.round(n||0)); };
  var $ = function(s){ return document.querySelector(s); };
  var toast=function(m){ var t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('show');},2200); };

  /* ---------- IndexedDB ---------- */
  var DB=null;
  function openDB(){
    return new Promise(function(res,rej){
      var r=indexedDB.open('rendiciones_db',1);
      r.onupgradeneeded=function(e){
        var db=e.target.result;
        if(!db.objectStoreNames.contains('receipts')) db.createObjectStore('receipts',{keyPath:'id'});
        if(!db.objectStoreNames.contains('settings')) db.createObjectStore('settings',{keyPath:'k'});
      };
      r.onsuccess=function(e){ res(e.target.result); };
      r.onerror=function(e){ rej(e.target.error); };
    });
  }
  function tx(store,mode){ return DB.transaction(store,mode).objectStore(store); }
  function idbAll(store){ return new Promise(function(res,rej){ var out=[],c=tx(store,'readonly').openCursor(); c.onsuccess=function(e){var cur=e.target.result; if(cur){out.push(cur.value);cur.continue();}else res(out);}; c.onerror=function(e){rej(e.target.error);}; }); }
  function idbPut(store,val){ return new Promise(function(res,rej){ var q=tx(store,'readwrite').put(val); q.onsuccess=function(){res();}; q.onerror=function(e){rej(e.target.error);}; }); }
  function idbDel(store,key){ return new Promise(function(res,rej){ var q=tx(store,'readwrite').delete(key); q.onsuccess=function(){res();}; q.onerror=function(e){rej(e.target.error);}; }); }
  function idbClear(store){ return new Promise(function(res,rej){ var q=tx(store,'readwrite').clear(); q.onsuccess=function(){res();}; q.onerror=function(e){rej(e.target.error);}; }); }

  /* Fallback to localStorage if IndexedDB unavailable */
  var useLS=false;
  var LS={
    all:function(){ try{return JSON.parse(localStorage.getItem('rend_receipts')||'[]');}catch(e){return [];} },
    save:function(a){ localStorage.setItem('rend_receipts',JSON.stringify(a)); },
    put:function(v){ var a=LS.all(); var i=a.findIndex(function(x){return x.id===v.id;}); if(i>=0)a[i]=v; else a.push(v); LS.save(a); },
    del:function(id){ LS.save(LS.all().filter(function(x){return x.id!==id;})); },
    clear:function(){ LS.save([]); }
  };

  /* ---------- State ---------- */
  var receipts=[];
  var settings={name:'',to:'',cc:'',company:'',note:''};
  var editingId=null, pendingPhoto=null; // {dataUrl,w,h}
  var lastPdf=null; // {blob,filename,subject,body}

  function uid(){ return 'r'+Math.round(performance.now()*1000).toString(36)+Math.round(performance.timeOrigin).toString(36); }

  function loadSettings(){
    return (useLS?Promise.resolve(JSON.parse(localStorage.getItem('rend_settings')||'null'))
                 :new Promise(function(res){ var q=tx('settings','readonly').get('main'); q.onsuccess=function(e){res(e.target.result?e.target.result.v:null);}; q.onerror=function(){res(null);}; }))
      .then(function(v){ if(v) settings=Object.assign(settings,v); });
  }
  function saveSettings(){
    if(useLS){ localStorage.setItem('rend_settings',JSON.stringify(settings)); return Promise.resolve(); }
    return idbPut('settings',{k:'main',v:settings});
  }
  function loadReceipts(){
    return (useLS?Promise.resolve(LS.all()):idbAll('receipts')).then(function(a){
      receipts=a.sort(function(x,y){ return (x.date||'').localeCompare(y.date||'') || (x.created||0)-(y.created||0); });
    });
  }

  /* ---------- Rendering ---------- */
  function render(){
    var total=receipts.reduce(function(s,r){return s+(r.amount||0);},0);
    $('#sumTotal').textContent=money(total);
    $('#sumCount').textContent=receipts.length;
    $('#btnGenerate').disabled=receipts.length===0;
    // period
    if(receipts.length){
      var ds=receipts.map(function(r){return r.date;}).filter(Boolean).sort();
      $('#sumPeriod').textContent = ds.length? fmtShort(ds[0])+(ds[ds.length-1]!==ds[0]?' – '+fmtShort(ds[ds.length-1]):'') : '';
    } else $('#sumPeriod').textContent='';
    $('#sumWho').textContent = settings.name?('· '+settings.name):'';

    var list=$('#list');
    if(!receipts.length){
      list.innerHTML='<div class="empty"><div class="em-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div><h3>Aún no hay boletas</h3><p>Toca <b>Agregar boleta</b>, saca una foto o elige una de tu galería, y anota el monto. Cuando termines, genera la rendición.</p></div>';
      $('#secClear').textContent='';
      return;
    }
    $('#secClear').textContent=receipts.length+' ítem'+(receipts.length>1?'s':'');
    list.innerHTML='';
    receipts.forEach(function(r,i){
      var el=document.createElement('div');
      el.className='receipt';
      el.innerHTML=
        '<img class="thumb" src="'+r.thumb+'" alt="">'+
        '<div class="r-main"><div class="r-desc">'+esc(r.desc||'Sin descripción')+'</div>'+
        '<div class="r-sub"><span class="r-cat">'+esc(r.cat||'General')+'</span><span>'+fmtShort(r.date)+'</span></div></div>'+
        '<div class="r-amt tnum">'+money(r.amount)+'</div>'+
        '<span class="r-chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>';
      el.addEventListener('click',function(){ openEditor(r.id); });
      list.appendChild(el);
    });
  }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function fmtShort(iso){ if(!iso) return ''; var p=iso.split('-'); if(p.length<3) return iso; return p[2]+'/'+p[1]+'/'+p[0].slice(2); }
  function fmtLong(iso){ if(!iso) return ''; var p=iso.split('-'); if(p.length<3) return iso; var m=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']; return parseInt(p[2],10)+' '+m[parseInt(p[1],10)-1]+' '+p[0]; }
  function todayISO(){ var d=new Date(); var off=d.getTimezoneOffset(); d=new Date(d.getTime()-off*60000); return d.toISOString().slice(0,10); }

  /* ---------- Sheets ---------- */
  var openSheetEl=null;
  function openSheet(id){
    openSheetEl=$('#'+id);
    $('#scrim').classList.add('show');
    openSheetEl.classList.add('show');
    document.body.style.overflow='hidden';
  }
  function closeSheet(){
    if(openSheetEl) openSheetEl.classList.remove('show');
    $('#scrim').classList.remove('show');
    document.body.style.overflow='';
    openSheetEl=null;
  }
  $('#scrim').addEventListener('click',closeSheet);
  Array.prototype.forEach.call(document.querySelectorAll('[data-close]'),function(b){ b.addEventListener('click',closeSheet); });

  /* ---------- Add / Edit ---------- */
  $('#btnAdd').addEventListener('click',function(){ editingId=null; pendingPhoto=null; $('#fileInput').value=''; $('#fileInput').click(); });

  $('#fileInput').addEventListener('change',function(e){
    var f=e.target.files&&e.target.files[0];
    if(!f) return;
    compress(f).then(function(img){
      pendingPhoto=img;
      if(editingId){ // replace photo on existing
        $('#editPhoto').src=img.dataUrl;
      } else {
        openEditor(null);
      }
    }).catch(function(){ toast('No pude leer la foto'); });
  });

  function compress(file){
    return new Promise(function(res,rej){
      var img=new Image();
      var url=URL.createObjectURL(file);
      img.onload=function(){
        var maxFull=1500, maxThumb=140;
        var scale=Math.min(1,maxFull/Math.max(img.width,img.height));
        var w=Math.round(img.width*scale), h=Math.round(img.height*scale);
        var c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        var full=c.toDataURL('image/jpeg',0.72);
        var ts=Math.min(1,maxThumb/Math.max(img.width,img.height));
        var tw=Math.round(img.width*ts), th=Math.round(img.height*ts);
        var tc=document.createElement('canvas'); tc.width=tw; tc.height=th;
        tc.getContext('2d').drawImage(img,0,0,tw,th);
        var thumb=tc.toDataURL('image/jpeg',0.6);
        URL.revokeObjectURL(url);
        res({dataUrl:full,thumb:thumb,w:w,h:h});
      };
      img.onerror=function(){ URL.revokeObjectURL(url); rej(); };
      img.src=url;
    });
  }

  function openEditor(id){
    editingId=id;
    var isNew=!id;
    clearSuggested(); $('#ocrNote').hidden=true; setReading(false);
    $('#editorTitle').textContent=isNew?'Nueva boleta':'Editar boleta';
    $('#btnDeleteReceipt').hidden=isNew;
    if(isNew){
      $('#editPhoto').src=pendingPhoto?pendingPhoto.dataUrl:'';
      $('#fDesc').value=''; $('#fAmt').value=''; $('#fDate').value=todayISO(); $('#fCat').value='General';
    } else {
      var r=receipts.find(function(x){return x.id===id;});
      pendingPhoto=null;
      $('#editPhoto').src=r.full;
      $('#fDesc').value=r.desc||''; $('#fAmt').value=r.amount?formatThousands(r.amount):''; $('#fDate').value=r.date||todayISO(); $('#fCat').value=r.cat||'General';
    }
    $('#btnRescan').style.display = ($('#editPhoto').getAttribute('src'))? '' : 'none';
    openSheet('editorSheet');
    if(isNew && pendingPhoto) setTimeout(function(){ startOCR(false); },350);
  }

  function formatThousands(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }
  function parseAmount(s){ return parseInt(String(s).replace(/[^\d]/g,''),10)||0; }

  $('#fAmt').addEventListener('input',function(){
    var v=parseAmount(this.value);
    this.value = v? formatThousands(v):'';
  });

  $('#btnRetake').addEventListener('click',function(){ $('#fileInput').value=''; $('#fileInput').click(); });
  $('#btnRescan').addEventListener('click',function(){ startOCR(true); });

  $('#btnSaveReceipt').addEventListener('click',function(){
    var amount=parseAmount($('#fAmt').value);
    var desc=$('#fDesc').value.trim();
    if(!amount){ toast('Ingresa el monto'); $('#fAmt').focus(); return; }
    var date=$('#fDate').value||todayISO();
    var cat=$('#fCat').value;
    if(editingId){
      var r=receipts.find(function(x){return x.id===editingId;});
      r.desc=desc; r.amount=amount; r.date=date; r.cat=cat;
      if(pendingPhoto){ r.full=pendingPhoto.dataUrl; r.thumb=pendingPhoto.thumb; r.w=pendingPhoto.w; r.h=pendingPhoto.h; }
      persist(r);
    } else {
      var rec={id:uid(),desc:desc,amount:amount,date:date,cat:cat,created:Date.now(),
        full:pendingPhoto?pendingPhoto.dataUrl:'',thumb:pendingPhoto?pendingPhoto.thumb:'',w:pendingPhoto?pendingPhoto.w:0,h:pendingPhoto?pendingPhoto.h:0};
      persist(rec);
    }
    pendingPhoto=null; editingId=null;
    closeSheet();
    loadReceipts().then(render).then(function(){ toast('Boleta guardada'); });
  });

  function persist(rec){
    if(useLS){ LS.put(strip(rec)); return Promise.resolve(); }
    return idbPut('receipts',rec);
  }
  function strip(r){ return r; }

  $('#btnDeleteReceipt').addEventListener('click',function(){
    if(!editingId) return;
    if(!confirm('¿Eliminar esta boleta?')) return;
    (useLS?Promise.resolve(LS.del(editingId)):idbDel('receipts',editingId))
      .then(function(){ editingId=null; closeSheet(); return loadReceipts().then(render); })
      .then(function(){ toast('Boleta eliminada'); });
  });

  /* ---------- Settings ---------- */
  $('#btnSettings').addEventListener('click',function(){
    $('#sName').value=settings.name||''; $('#sTo').value=settings.to||''; $('#sCc').value=settings.cc||'';
    $('#sCompany').value=settings.company||''; $('#sNote').value=settings.note||'';
    openSheet('settingsSheet');
  });
  $('#btnSaveSettings').addEventListener('click',function(){
    settings.name=$('#sName').value.trim(); settings.to=$('#sTo').value.trim(); settings.cc=$('#sCc').value.trim();
    settings.company=$('#sCompany').value.trim(); settings.note=$('#sNote').value.trim();
    saveSettings().then(function(){ closeSheet(); render(); toast('Ajustes guardados'); });
  });
  $('#btnClearAll').addEventListener('click',function(){
    if(!receipts.length){ toast('No hay boletas'); return; }
    if(!confirm('¿Vaciar todas las boletas? Esta acción no se puede deshacer.')) return;
    (useLS?Promise.resolve(LS.clear()):idbClear('receipts'))
      .then(function(){ return loadReceipts().then(render); })
      .then(function(){ closeSheet(); toast('Boletas vaciadas'); });
  });

  /* ---------- OCR (lectura de la boleta en el dispositivo) ---------- */
  var OCR={ready:false,state:'unknown',_p:null};
  function loadTesseract(){
    if(window.Tesseract){ OCR.ready=true; return Promise.resolve(true); }
    if(OCR._p) return OCR._p;
    OCR._p=new Promise(function(res){
      var done=false;
      function finish(v){ if(done) return; done=true; OCR.ready=!!(v&&window.Tesseract);
        if(!OCR.ready) OCR.state='unavailable'; res(OCR.ready); }
      // Salvavidas: si el entorno bloquea la descarga (p. ej. dentro de claude.ai),
      // no dejar el spinner colgado para siempre.
      setTimeout(function(){ finish(false); },8000);
      function add(src,next){
        var s=document.createElement('script'); s.src=src; s.async=true;
        s.onload=function(){ finish(true); };
        s.onerror=function(){ next?next():finish(false); };
        document.head.appendChild(s);
      }
      add('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js',function(){
        add('https://unpkg.com/tesseract.js@5/dist/tesseract.min.js',null);
      });
    });
    return OCR._p;
  }
  function runOCR(src){
    return loadTesseract().then(function(ok){
      if(!ok||!window.Tesseract) return Promise.reject(new Error('no-ocr'));
      var rec=window.Tesseract.recognize(src,'spa+eng',{langPath:'https://tessdata.projectnaptha.com/4.0.0_fast'});
      var to=new Promise(function(_,rej){ setTimeout(function(){ rej(new Error('timeout')); },30000); });
      return Promise.race([rec,to]);
    }).then(function(r){ OCR.state='ok'; return parseReceipt(r&&r.data?r.data.text:''); });
  }
  function amountsIn(str){
    var out=[],re=/\$?\s?(\d{1,3}(?:[.\s]\d{3})+|\d{3,7})(?!\d)/g,m;
    while((m=re.exec(str))){ var n=parseInt(m[1].replace(/[.\s]/g,''),10); if(n>=100&&n<=20000000) out.push(n); }
    return out;
  }
  // Solo montos "con formato de dinero": con $ delante o con puntos de miles.
  // Evita confundir IDs/números largos de la boleta con el monto.
  function moneyMarkedIn(str){
    var out=[],re=/(?:\$\s?(\d{1,3}(?:[.\s]\d{3})+|\d{2,7})|(\d{1,3}(?:\.\d{3})+))/g,m;
    while((m=re.exec(str))){ var g=m[1]||m[2]; if(!g) continue; var n=parseInt(g.replace(/[.\s]/g,''),10); if(n>=100&&n<=20000000) out.push(n); }
    return out;
  }
  function titleCase(s){ s=String(s).toLowerCase().replace(/\s+/g,' ').trim();
    return s.replace(/(^|\s)([a-záéíóúñ])/g,function(_,p,c){return p+c.toUpperCase();}); }
  function parseReceipt(text){
    var out={amount:0,date:'',desc:''};
    if(!text) return out;
    var raw=text.replace(/\r/g,'');
    var lines=raw.split('\n').map(function(l){return l.trim();}).filter(Boolean);
    var upper=raw.toUpperCase();
    // Monto: preferir líneas con TOTAL (no SUBTOTAL); si no, el mayor del ticket
    var tot=[];
    lines.forEach(function(l){ var U=l.toUpperCase();
      if(/(TOTAL|A\s*PAGAR|\bPAGAR\b|MONTO)/.test(U)&&!/SUB\s*-?\s*TOTAL/.test(U)) amountsIn(l).forEach(function(n){tot.push(n);}); });
    if(tot.length) out.amount=Math.max.apply(null,tot);
    else { var mk=moneyMarkedIn(raw); if(mk.length) out.amount=Math.max.apply(null,mk); }
    // Fecha DD/MM/AAAA
    var dm=raw.match(/([0-3]?\d)\s*[\/\-.]\s*([01]?\d)\s*[\/\-.]\s*(20\d{2}|\d{2})/);
    if(dm){ var d=+dm[1],mo=+dm[2],y=dm[3]; if(y.length===2)y='20'+y;
      if(d>=1&&d<=31&&mo>=1&&mo<=12) out.date=y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
    if(!out.date){
      var M={ENE:1,FEB:2,MAR:3,ABR:4,MAY:5,JUN:6,JUL:7,AGO:8,SEP:9,SEPT:9,OCT:10,NOV:11,DIC:12};
      var mm=upper.match(/([0-3]?\d)\s*[-\s]?\s*(ENE|FEB|MAR|ABR|MAY|JUN|JUL|AGO|SEPT?|OCT|NOV|DIC)[A-Z]*\.?\s*[-\s]?\s*(20\d{2}|\d{2})/);
      if(mm){ var d2=+mm[1],mo2=M[mm[2]],y2=mm[3]; if(y2.length===2)y2='20'+y2;
        if(d2>=1&&d2<=31&&mo2) out.date=y2+'-'+String(mo2).padStart(2,'0')+'-'+String(d2).padStart(2,'0'); }
    }
    // Comercio / descripción: primera línea "de texto" arriba del ticket
    for(var i=0;i<Math.min(lines.length,6);i++){
      var l=lines[i], U=l.toUpperCase();
      var letters=(l.match(/[A-Za-zÁÉÍÓÚÑáéíóúñ]/g)||[]).length;
      var digits=(l.match(/\d/g)||[]).length;
      if(letters>=3&&letters>digits&&l.length<=42&&
         !/BOLETA|FACTURA|R\.?U\.?T|GIRO|DIRECCI|FECHA|TOTAL|SUBTOTAL|IVA|NETO|CANT|PRECIO|GRACIAS|VUELTO|EFECTIVO/.test(U)){
        out.desc=titleCase(l); break;
      }
    }
    return out;
  }
  function setReading(on){ $('#ocrOverlay').hidden=!on; $('#btnRescan').disabled=on; $('#btnRetake').disabled=on; }
  function clearSuggested(){ ['#fDesc','#fAmt','#fDate','#fCat'].forEach(function(s){ $(s).classList.remove('suggested'); }); }
  function noteOk(t){ var n=$('#ocrNote'); n.className='ocr-note'; n.textContent=t; n.hidden=false; }
  function noteWarn(t){ var n=$('#ocrNote'); n.className='ocr-note warn'; n.textContent=t; n.hidden=false; }
  var OCR_OFF_MSG='La lectura automática no se puede cargar aquí (el entorno de este enlace la bloquea). Abre la app desde una dirección web propia para que funcione, o ingresa los datos a mano.';
  function startOCR(force){
    var src=(pendingPhoto&&pendingPhoto.dataUrl)||$('#editPhoto').getAttribute('src');
    if(!src){ toast('Primero saca una foto'); return; }
    if(OCR.state==='unavailable'){ setReading(false); noteWarn(OCR_OFF_MSG); return; }
    setReading(true); $('#ocrNote').hidden=true;
    runOCR(src).then(function(d){
      setReading(false);
      var got=false;
      if(d.amount&&(force||!parseAmount($('#fAmt').value))){ $('#fAmt').value=formatThousands(d.amount); $('#fAmt').classList.add('suggested'); got=true; }
      if(d.date&&(force||$('#fDate').value===todayISO()||!$('#fDate').value)){ $('#fDate').value=d.date; $('#fDate').classList.add('suggested'); got=true; }
      if(d.desc&&(force||!$('#fDesc').value.trim())){ $('#fDesc').value=d.desc; $('#fDesc').classList.add('suggested'); got=true; }
      if(got){ noteOk('✨ Datos leídos de la foto — revísalos antes de guardar.'); toast('Datos leídos ✓ revísalos'); }
      else noteWarn('No logré leer los datos de esta foto. Usa “Leer de nuevo” (boleta plana y buena luz) o ingrésalos a mano.');
    }).catch(function(e){
      setReading(false);
      if(e&&(e.message==='no-ocr'||e.message==='timeout')){ OCR.state='unavailable'; noteWarn(OCR_OFF_MSG); }
      else toast('No pude leer la boleta');
    });
  }

  /* ---------- PDF ---------- */
  function buildPDF(){
    var jsPDF=window.jspdf.jsPDF;
    var doc=new jsPDF({unit:'mm',format:'a4',compress:true});
    var PW=210, PH=297, M=15, CW=PW-2*M;
    var total=receipts.reduce(function(s,r){return s+(r.amount||0);},0);
    var ds=receipts.map(function(r){return r.date;}).filter(Boolean).sort();
    var periodo = ds.length? (fmtLong(ds[0])+(ds[ds.length-1]!==ds[0]?'  al  '+fmtLong(ds[ds.length-1]):'')) : '';

    // Header band
    doc.setFillColor(11,107,91); doc.rect(0,0,PW,30,'F');
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','bold'); doc.setFontSize(19);
    doc.text('RENDICIÓN DE GASTOS',M,15);
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    if(settings.company) doc.text(settings.company,M,23);
    doc.setFontSize(9);
    doc.text('Emitida: '+fmtLong(todayISO()),PW-M,15,{align:'right'});
    doc.text(receipts.length+' boleta'+(receipts.length!==1?'s':''),PW-M,23,{align:'right'});

    // Meta block
    var y=40;
    doc.setTextColor(40,40,40); doc.setFontSize(10);
    var metaL=[];
    if(settings.name) metaL.push(['Solicitante',settings.name]);
    if(settings.to) metaL.push(['Enviado a',settings.to]);
    if(periodo) metaL.push(['Período',periodo]);
    if(settings.note) metaL.push(['Motivo',settings.note]);
    metaL.forEach(function(row){
      doc.setFont('helvetica','bold'); doc.setTextColor(90,90,90);
      doc.text(row[0]+':',M,y);
      doc.setFont('helvetica','normal'); doc.setTextColor(30,30,30);
      var lines=doc.splitTextToSize(String(row[1]),CW-32);
      doc.text(lines,M+30,y);
      y+=Math.max(6, lines.length*5);
    });
    y+=3;

    // Table header
    var cN=M, cF=M+13, cD=M+40, cM=PW-M; // right edge for amount
    var descW=cM-cD-32;
    function tableHead(yy){
      doc.setFillColor(238,240,238); doc.rect(M,yy-5,CW,8,'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(60,60,60);
      doc.text('N°',cN+1,yy);
      doc.text('Fecha',cF,yy);
      doc.text('Descripción',cD,yy);
      doc.text('Monto',cM,yy,{align:'right'});
      return yy+7;
    }
    y=tableHead(y+3);
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(25,25,25);

    receipts.forEach(function(r,i){
      var descLines=doc.splitTextToSize((r.desc||'Sin descripción')+(r.cat&&r.cat!=='General'?'  ·  '+r.cat:''),descW);
      var rowH=Math.max(7, descLines.length*4.6+3);
      if(y+rowH>PH-22){ doc.addPage(); y=tableHead(20); doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(25,25,25); }
      doc.text(String(i+1),cN+1,y);
      doc.text(fmtShort(r.date),cF,y);
      doc.text(descLines,cD,y);
      doc.setFont('helvetica','bold');
      doc.text(money(r.amount),cM,y,{align:'right'});
      doc.setFont('helvetica','normal');
      doc.setDrawColor(225,223,215); doc.setLineWidth(0.2);
      doc.line(M,y+rowH-4,PW-M,y+rowH-4);
      y+=rowH;
    });

    // Total
    if(y>PH-24){ doc.addPage(); y=24; }
    y+=2;
    doc.setFillColor(11,107,91); doc.rect(cD-4,y-5,cM-(cD-4)+0,9,'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(11);
    doc.text('TOTAL',cD,y+1);
    doc.text(money(total),cM-2,y+1,{align:'right'});
    doc.setTextColor(25,25,25);

    // Signature line
    y+=22;
    if(y<PH-30){
      doc.setDrawColor(150,150,150); doc.setLineWidth(0.3);
      doc.line(M,y,M+70,y);
      doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(90,90,90);
      doc.text('Firma solicitante'+(settings.name?'  ·  '+settings.name:''),M,y+5);
    }

    // Photos — one per page
    var withPhotos=receipts.filter(function(r){return r.full;});
    withPhotos.forEach(function(r,idx){
      doc.addPage();
      doc.setFillColor(11,107,91); doc.rect(0,0,PW,20,'F');
      doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(11);
      doc.text('Boleta N° '+(receipts.indexOf(r)+1),M,13);
      doc.setFont('helvetica','normal'); doc.setFontSize(9);
      doc.text(money(r.amount),PW-M,13,{align:'right'});
      // caption
      doc.setTextColor(40,40,40); doc.setFontSize(10);
      var cap=(r.desc||'Sin descripción')+'   ·   '+fmtLong(r.date)+(r.cat&&r.cat!=='General'?'   ·   '+r.cat:'');
      var capL=doc.splitTextToSize(cap,CW);
      doc.text(capL,M,28);
      var top=28+capL.length*5+3;
      // image fit
      var availH=PH-top-M, availW=CW;
      var iw=r.w||1, ih=r.h||1, ratio=ih/iw;
      var dw=availW, dh=dw*ratio;
      if(dh>availH){ dh=availH; dw=dh/ratio; }
      var ix=M+(availW-dw)/2;
      try{ doc.addImage(r.full,'JPEG',ix,top,dw,dh); }catch(e){}
      doc.setDrawColor(220,218,210); doc.setLineWidth(0.2); doc.rect(ix,top,dw,dh);
    });

    var fname='Rendicion_'+(settings.name?settings.name.split(' ')[0]+'_':'')+todayISO()+'.pdf';
    fname=fname.replace(/[^\w.\-]/g,'');
    return {doc:doc,blob:doc.output('blob'),filename:fname,total:total,periodo:periodo};
  }

  function emailContent(total,periodo){
    var subject='Rendición de gastos'+(settings.name?' – '+settings.name:'')+' – '+fmtLong(todayISO());
    var lines=[];
    lines.push('Estimados,');
    lines.push('');
    lines.push('Adjunto la rendición de gastos'+(settings.company?' de '+settings.company:'')+(periodo?' correspondiente al período '+periodo:'')+'.');
    lines.push('');
    lines.push('Detalle:');
    receipts.forEach(function(r,i){
      lines.push('  '+(i+1)+'. '+fmtShort(r.date)+'  '+(r.desc||'Sin descripción')+' — '+money(r.amount));
    });
    lines.push('');
    lines.push('TOTAL A RENDIR: '+money(total)+'  ('+receipts.length+' boleta'+(receipts.length!==1?'s':'')+')');
    lines.push('');
    if(settings.note){ lines.push('Motivo: '+settings.note); lines.push(''); }
    lines.push('Se adjunta documento PDF con el detalle y las fotos de las boletas.');
    lines.push('');
    lines.push('Saludos,');
    lines.push(settings.name||'');
    return {subject:subject,body:lines.join('\n')};
  }

  /* ---------- Generate ---------- */
  $('#btnGenerate').addEventListener('click',function(){
    if(!receipts.length) return;
    var missing=receipts.some(function(r){return !r.desc;});
    var proceed=true;
    if(missing) proceed=confirm('Hay boletas sin descripción. ¿Generar de todas formas?');
    if(!proceed) return;
    toast('Generando PDF…');
    setTimeout(function(){
      try{
        var out=buildPDF();
        var em=emailContent(out.total,out.periodo);
        lastPdf={blob:out.blob,filename:out.filename,subject:em.subject,body:em.body,total:out.total};
        $('#resTotal').textContent=money(out.total);
        $('#resSub').textContent=receipts.length+' boleta'+(receipts.length!==1?'s':'')+(settings.to?'  ·  '+settings.to:'');
        // capability hints
        var canShare = !!(navigator.canShare && navigator.canShare({files:[new File([out.blob],out.filename,{type:'application/pdf'})]}));
        $('#optShare').style.display = canShare? '' : 'none';
        $('#resHint').innerHTML = settings.to? '' : 'Consejo: define el <b>correo destinatario</b> en Ajustes (⚙) para que el borrador salga completo.';
        $('#resHint').style.display = settings.to? 'none':'';
        openSheet('resultSheet');
      }catch(e){ toast('Error al generar el PDF'); console.error(e); }
    },60);
  });

  $('#optShare').addEventListener('click',function(){
    if(!lastPdf) return;
    var file=new File([lastPdf.blob],lastPdf.filename,{type:'application/pdf'});
    var data={files:[file],title:lastPdf.subject,text:lastPdf.body};
    if(navigator.canShare && navigator.canShare(data)){
      navigator.share(data).then(function(){ closeSheet(); }).catch(function(err){ if(err&&err.name!=='AbortError') fallbackDownload(); });
    } else { fallbackDownload(); toast('Compartir no disponible aquí; PDF descargado'); }
  });
  $('#optMail').addEventListener('click',function(){
    if(!lastPdf) return;
    var url='mailto:'+encodeURIComponent(settings.to||'')
      +'?subject='+encodeURIComponent(lastPdf.subject)
      +(settings.cc?'&cc='+encodeURIComponent(settings.cc):'')
      +'&body='+encodeURIComponent(lastPdf.body);
    // download the PDF first so they can attach it, then open the draft
    fallbackDownload(true);
    toast('PDF descargado · abriendo correo…');
    setTimeout(function(){ window.location.href=url; },500);
  });
  $('#optDownload').addEventListener('click',function(){ fallbackDownload(); toast('PDF descargado'); });

  function fallbackDownload(silent){
    if(!lastPdf) return;
    var a=document.createElement('a');
    var url=URL.createObjectURL(lastPdf.blob);
    a.href=url; a.download=lastPdf.filename; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },1500);
  }

  /* ---------- Boot ---------- */
  function boot(){
    render();
    loadReceipts().then(render);
  }
  openDB().then(function(db){ DB=db; return loadSettings(); }).then(loadReceipts).then(function(){
    render();
  }).catch(function(err){
    console.warn('IndexedDB no disponible, usando almacenamiento local',err);
    useLS=true;
    return loadSettings().then(loadReceipts).then(render);
  });
  // Precargar el motor de lectura (no bloquea; falla en silencio si no hay red)
  try{ loadTesseract(); }catch(e){}
})();
</script>
